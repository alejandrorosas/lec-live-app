name: Label Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

jobs:
  label-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check for valid labels
        uses: actions/github-script@v9
        with:
          script: |
            const semverLabels = ['major', 'minor', 'patch', 'skip-changelog'];
            const prLabels = context.payload.pull_request.labels;

            const hasDependencies = prLabels.some(label => label.name === 'dependencies');
            const matchingSemver = prLabels.filter(label => semverLabels.includes(label.name));

            if (!hasDependencies && matchingSemver.length !== 1) {
              const found = matchingSemver.length === 0 ? 'none' : matchingSemver.map(l => l.name).join(', ');
              core.setFailed(`Exactly ONE of the following labels is required to indicate the impact of this change: ${semverLabels.join(', ')}. Found: ${found}.`);
            }
